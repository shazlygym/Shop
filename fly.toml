app = "shopify-wa-confirm"
primary_region = "fra"

kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  USER_API_PORT = "3001"
  USER_WORKER_PORT = "3002"
  USER_DEFAULT_COUNTRY_CODE = "20"
  USER_WHATSAPP_SESSION_PATH = "/data/wa-session"
  DATABASE_URL = "file:/data/dev.db"
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

[mounts]
  source = "app_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
